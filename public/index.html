<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wow</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Wow</h1>
    <p id="splash-message">正在启动本地代理…</p>
    <button id="retry-backend" class="button primary hidden" type="button">重新启动</button>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">W</span><span>Wow</span></div>
      <nav id="main-navigation" aria-label="主导航">
        <button class="nav-item tauri-only" data-page="home" type="button">首页</button>
        <button class="nav-item" data-page="login" type="button">Login</button>
      </nav>
      <div class="sidebar-status tauri-only"><span class="status-dot"></span>本地代理运行中</div>
    </aside>

    <main class="content">
      <section id="home-page" class="page tauri-only">
        <header class="page-header">
          <p class="eyebrow">WOW ORIGIN</p>
          <h1>本地音乐代理</h1>
          <p>保持此应用运行，让同一局域网内的 Aduoer 连接这台电脑。</p>
        </header>
        <div class="home-grid single-card-grid">
          <article class="card connection-card">
            <div class="card-title-row"><h2>连接地址</h2><span class="badge success">运行中</span></div>
            <label class="field">
              <span>IP 地址</span>
              <select id="address-select"></select>
            </label>
            <div class="field">
              <span>端口</span>
              <div id="port-value" class="value-box mono">—</div>
            </div>
            <div class="field">
              <span>完整地址</span>
              <div class="copy-row">
                <div id="host-value" class="value-box mono ellipsis">—</div>
                <button id="copy-host" class="icon-button" type="button">复制</button>
              </div>
            </div>
            <p id="network-warning" class="notice warning hidden">当前仅检测到本机地址，手机无法通过该地址连接。请确认电脑已连接局域网。</p>
          </article>
        </div>
      </section>

      <section id="login-page" class="page hidden">
        <header class="page-header">
          <p class="eyebrow">ACCOUNT</p>
          <h1>账号登录</h1>
          <p>通过 QQ 音乐或网易云音乐扫码创建账号，也可以管理已有账号。</p>
        </header>

        <article class="card login-card">
          <div id="login-choose" class="login-step">
            <h2>选择操作</h2>
            <div class="button-stack">
              <button id="choose-create" class="button primary" type="button">扫码添加新账号</button>
              <button id="choose-update" class="button secondary" type="button">更新已存在账号</button>
            </div>
          </div>

          <div id="login-verify" class="login-step hidden">
            <h2>验证已有账号</h2>
            <label class="field"><span>api_access_key</span><input id="verify-key" class="mono" autocomplete="off" placeholder="输入账号访问密钥"></label>
            <div class="button-row">
              <button class="button secondary back-choose" type="button">返回</button>
              <button id="verify-submit" class="button primary" type="button">验证</button>
            </div>
          </div>

          <div id="login-scan" class="login-step hidden">
            <div class="card-title-row"><h2>扫码登录</h2><span id="scan-platform-label" class="badge"></span></div>
            <div id="platform-switch" class="segment">
              <button data-platform="qq" type="button">QQ 音乐</button>
              <button data-platform="netease" type="button">网易云音乐</button>
            </div>
            <div class="qr-frame login-qr"><img id="login-qr" alt="账号登录二维码"><span id="qr-placeholder">正在生成二维码…</span></div>
            <p id="scan-message" class="message">准备扫码登录</p>
            <div class="button-row">
              <button id="scan-back" class="button secondary" type="button">返回</button>
              <button id="regenerate-qr" class="button primary" type="button">刷新二维码</button>
            </div>
          </div>

          <div id="account-config" class="login-step hidden">
            <div class="card-title-row"><h2>账号配置</h2><span id="account-platform" class="badge"></span></div>
            <div class="account-identity">
              <div class="account-identity-fields">
                <label class="field"><span>api_access_key</span><div class="copy-row"><div id="account-key" class="value-box mono ellipsis"></div><button id="copy-key" class="icon-button" type="button">复制</button></div></label>
                <label class="field"><span>名称</span><input id="account-name" maxlength="100"></label>
              </div>
              <div class="account-qr-panel">
                <div class="qr-frame account-qr"><img id="account-origin-qr" alt="Aduoer 添加账号源二维码"><span id="account-qr-placeholder">正在生成二维码…</span></div>
                <small>使用自带相机/扫码 App 扫描</small>
              </div>
            </div>
            <label class="switch-row"><span><strong>无状态模式</strong><small>用户数据由 Aduoer 客户端维护</small></span><input id="account-stateless" type="checkbox" role="switch"></label>
            <label class="switch-row"><span><strong>使用洛雪源</strong><small>优先使用洛雪源，失败后回退官方源</small></span><input id="account-luoxue" type="checkbox" role="switch"></label>
            <div id="account-lx-source-settings" class="field">
              <div class="field-heading"><span>账号洛雪源</span><button id="add-lx-source" class="text-button" type="button">添加地址</button></div>
              <div id="lx-source-list" class="source-list"></div>
              <small>账号源将优先于环境变量中的全局源，最多 10 个。</small>
            </div>
            <p id="config-message" class="message"></p>
            <div class="button-row wrap">
              <button class="button secondary back-choose" type="button">返回选择</button>
              <button id="relogin" class="button secondary" type="button">重新扫码登录</button>
              <button id="save-config" class="button primary" type="button">保存配置</button>
            </div>
          </div>
          <p id="login-error" class="message error" role="alert"></p>
        </article>
      </section>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
